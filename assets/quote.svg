<svg xmlns="http://www.w3.org/2000/svg" width="620" height="74" viewBox="0 0 620 74" fill="none">
<defs>
  <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7287fd"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#00d4ff"/>
  </linearGradient>
  <linearGradient id="gradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#7287fd"/>
  </linearGradient>
  <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a333d8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#7287fd" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#a333d8" stop-opacity="0.4"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>
  <rect width="620" height="74" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect width="4" height="58" x="8" y="8" rx="2" fill="url(#gradHeader)"/>
  <text x="26" y="42" font-size="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" fill="#a333d8" text-anchor="start" opacity="0.8">“</text>
  <text x="58" y="34" font-size="13" font-style="italic" font-family="Georgia, serif" fill="#c9d1d9">The quieter you become, the more you can hear.</text>
  <text x="58" y="58" font-size="11" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="normal" fill="#8b949e" text-anchor="start" opacity="1">— Ram Dass — Kali Linux motto</text>
</svg>
