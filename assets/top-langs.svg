<svg xmlns="http://www.w3.org/2000/svg" width="460" height="195" viewBox="0 0 460 195" fill="none">
<defs>
  <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7287fd"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#00d4ff"/>
  </linearGradient>
  <linearGradient id="gradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#7287fd"/>
  </linearGradient>
  <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a333d8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#7287fd" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#a333d8" stop-opacity="0.4"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>
  <rect width="460" height="195" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="20" y="32" font-size="16" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="bold" fill="#a333d8" text-anchor="start" opacity="1">Most Used Languages</text>
  <rect x="20" y="40" width="200" height="2" rx="1" fill="url(#gradHeader)" opacity="0.6"/>
