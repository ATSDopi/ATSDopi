<svg xmlns="http://www.w3.org/2000/svg" width="496" height="32" viewBox="0 0 496 32" fill="none">
<defs>
  <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7287fd"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#00d4ff"/>
  </linearGradient>
  <linearGradient id="gradFooter" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d4ff"/>
    <stop offset="50%" stop-color="#a333d8"/>
    <stop offset="100%" stop-color="#7287fd"/>
  </linearGradient>
  <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#a333d8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#7287fd" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#a333d8" stop-opacity="0.4"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>
  <rect width="496" height="32" fill="none"/>
  <g transform="translate(0, 0)">
    <rect width="160" height="32" rx="4" fill="#0d1117" stroke="#00d4ff" stroke-width="1"/>
    <rect width="88.0" height="32" rx="4" fill="#00d4ff" opacity="0.15"/>
    <line x1="88.0" y1="0" x2="88.0" y2="32" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="44.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#00d4ff" text-anchor="middle">Status</text>
    <text x="124.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Online</text>
  </g>
  <g transform="translate(168, 0)">
    <rect width="160" height="32" rx="4" fill="#0d1117" stroke="#a333d8" stroke-width="1"/>
    <rect width="88.0" height="32" rx="4" fill="#a333d8" opacity="0.15"/>
    <line x1="88.0" y1="0" x2="88.0" y2="32" stroke="#a333d8" stroke-width="1" opacity="0.5"/>
    <text x="44.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#a333d8" text-anchor="middle">Focus</text>
    <text x="124.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#c9d1d9" text-anchor="middle">CTF & Security</text>
  </g>
  <g transform="translate(336, 0)">
    <rect width="160" height="32" rx="4" fill="#0d1117" stroke="#7287fd" stroke-width="1"/>
    <rect width="88.0" height="32" rx="4" fill="#7287fd" opacity="0.15"/>
    <line x1="88.0" y1="0" x2="88.0" y2="32" stroke="#7287fd" stroke-width="1" opacity="0.5"/>
    <text x="44.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#7287fd" text-anchor="middle">Role</text>
    <text x="124.0" y="21" font-size="11" font-family="Segoe UI, sans-serif" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Student</text>
  </g>
</svg>
